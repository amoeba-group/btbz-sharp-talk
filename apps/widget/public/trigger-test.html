<!doctype html>
<!--
  Storefront harness for trigger mode (PLN-260916 P2). Same origin as the widget
  dev server on purpose: Vite's dev server refuses cross-origin script loads, so
  a separate demo host cannot pull embed.js locally. Production stores load it
  cross-origin from nginx, which is what the staging smoke exercises.
-->
<html lang="en"><head><meta charset="utf-8"><title>Demo store — header trigger</title>
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:#111}
  header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff}
  .icons{display:flex;gap:18px;align-items:center}
  #st-bell{position:relative;background:none;border:0;font-size:22px;cursor:pointer;line-height:1}
  [data-sharptalk-badge]{position:absolute;top:-6px;right:-10px;background:#e11d48;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 6px}
  main{padding:48px 24px;height:1400px}
</style></head>
<body>
  <header>
    <strong>IVY beauty</strong>
    <div class="icons"><span>👤</span><span>🛒</span>
      <button id="st-bell" type="button" aria-label="Notifications">🔔<span data-sharptalk-badge style="display:none"></span></button>
      <!-- ?notrigger=1 removes this opener: reproduces a store whose theme has not been updated yet (FIX-260916). -->
    </div>
  </header>
  <main><h1>Clean beauty, delivered.</h1><p id="outside">Page content — clicking here is "outside" the docked panel.</p></main>
  <script>
    window.SHARPTALK_WIDGET_CONFIG = {
      shop: new URLSearchParams(location.search).get('shop') || 'ivyusa.myshopify.com',
      // Same directory this page is served from: '/' on the dev server, '/widget'
      // once the built app is mounted under its base path.
      widgetUrl: location.href.split('?')[0].replace(/[^/]*$/, '').replace(/\/$/, ''),
      trigger: '#st-bell',
    };
    if (new URLSearchParams(location.search).has('notrigger')) {
      delete window.SHARPTALK_WIDGET_CONFIG.trigger;
      document.getElementById('st-bell').remove();
    }
  </script>
  <script src="./embed.js" defer></script>
</body></html>
