# Shopify app configuration (Dev Dashboard "shoptalk", client_id = staging SHOPIFY_API_KEY).
# Deployed with `shopify app deploy` — creates and releases a new app version.
# Mirrors the settings already active in the dashboard (App URL / proxy / legacy install)
# and adds the missing auth redirect URL + mandatory GDPR compliance webhooks.

client_id = "6999d1547fe02aeafa5d0b9396aa4aba"
name = "shoptalk"
application_url = "https://shoptalk.amoeba.site"
embedded = false

[access_scopes]
# What a store actually grants is the INTERSECTION of this list and the scopes in
# the OAuth authorize URL (built from SHOPIFY_SCOPES, shopify-oauth.service.ts), so
# both have to be kept in sync — measured on a live store, in both directions:
#   this file declared read_fulfillments but the install URL asked for only two
#   scopes  -> two granted; asking for four while the app declared two
#             -> still two granted, silently, with no error.
# write_customer_data_erasure is required by customerRequestDataErasure (DSAR
# propagation). It is not sufficient on its own: the store also demands the staff
# user hold the "Erase customer data" permission, which no scope can grant.
# read_products (added 2026-09-20) is what lets an order line report its variant
# title and picture. Declaring it here is only half the job: a store that
# installed under the old scope set keeps the old grant until it re-authorises,
# so the sync negotiates the line-item selection down when the token cannot read
# it (shopify-admin.client.ts, `fetchOrdersPage`).
scopes = "read_orders,read_customers,read_fulfillments,read_products,write_customer_data_erasure"
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://shoptalk.amoeba.site/api/v1/auth/shopify/callback"
]

[webhooks]
api_version = "2026-07"

# NOTE: app-level `topics` subscriptions are NOT allowed while
# use_legacy_install_flow = true (CLI rejects the deploy). Operational webhooks
# (orders/*, fulfillments/*) are registered per shop at runtime via
# webhookSubscriptionCreate — orders topics additionally require Protected
# Customer Data approval; until then the scheduled incremental sync covers them.
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request" ]
uri = "https://shoptalk.amoeba.site/api/v1/webhooks/shopify/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/redact" ]
uri = "https://shoptalk.amoeba.site/api/v1/webhooks/shopify/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = [ "shop/redact" ]
uri = "https://shoptalk.amoeba.site/api/v1/webhooks/shopify/shop/redact"

[app_proxy]
url = "https://shoptalk.amoeba.site/api/v1/shopify/proxy"
prefix = "apps"
subpath = "ivy"
