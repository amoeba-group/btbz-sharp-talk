# Static SPA server baked into the web image (apps/web/dist). Staging.
server {
    listen 80;
    server_name _;
    # Directory redirects (/manual → /manual/) must stay relative: behind the host
    # TLS proxy an absolute Location would point at http:// on the internal port.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Compression (PERF-4): ~68% transfer cut on JS/CSS/JSON.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;


    # Security headers (SEC-L2/INF-4). Framing is denied except from the AMA
    # portal (PLN-260813-AMA-Iframe-SSO S1): frame-ancestors supersedes the
    # removed X-Frame-Options (ALLOW-FROM is obsolete and cannot express this).
    # `always` so they apply to error responses too.
    # HSTS is honored only when received over TLS — it passes through the host
    # TLS proxy to the browser; direct-HTTP (dev) responses carry it harmlessly.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://ama.amoeba.site" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Manual site raw-Markdown downloads render in the browser instead of
    # downloading (md is absent from mime.types → octet-stream otherwise).
    # `types {}` here is scoped to this location, so the global map is intact.
    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Long-cache hashed assets. (nginx does not inherit server-level add_header
    # into a location that declares its own, so restate nosniff here.)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
