# Static widget SPA baked into the widget image (apps/widget/dist), served under /widget/.
# Build base is /widget/, so index.html references /widget/assets/...
#
# THIS FILE IS AN ENVSUBST TEMPLATE (PLN-261012 SG-82). The Dockerfile copies it to
# /etc/nginx/templates/default.conf.template; the nginx image's entrypoint renders it
# into conf.d/default.conf at container START, replacing only the WIDGET_* names
# written in dollar-brace form below (nginx's own $variables are left alone). Both variables are given defaults by the
# Dockerfile, so an unconfigured container behaves exactly as it did before.
#
#   WIDGET_FRAME_ANCESTORS  space-separated ORIGINS allowed to put the widget in an
#       iframe, e.g.  https://hotel-admin.go2joy.vn https://staging-admin.go2joy.vn
#       Blank (default) sends no frame-ancestors header at all: any site may embed it,
#       as before. Set it for a deployment whose widget should only live inside known
#       hosts. Include 'self' ONLY if you also open the widget URL in a tab of its own.
#       NOTE: if the edge proxy or a CDN in front adds its own Content-Security-Policy
#       it must carry the same frame-ancestors — browsers enforce every policy they get.
#   WIDGET_FONT_CSS_URL     the base font stylesheet the widget iframe loads, served as
#       /widget/base-font.css. Default is Pretendard on jsDelivr; point it at a copy
#       you host (e.g. /widget/fonts/pretendard/pretendard.css) so the iframe makes no
#       third-party request, or set it blank for system fonts only. A plain URL or
#       path: no quotes, spaces or semicolons.

map $request_method $widget_frame_ancestors {
    default "${WIDGET_FRAME_ANCESTORS}";
}
# An empty header value is not sent, so blank really means "no header".
map $widget_frame_ancestors $widget_csp_frame_ancestors {
    ""      "";
    default "frame-ancestors $widget_frame_ancestors";
}
map "${WIDGET_FONT_CSS_URL}" $widget_font_css {
    ""      "/* no external font stylesheet configured: system fonts only */";
    default "@import url('${WIDGET_FONT_CSS_URL}');";
}

server {
    listen 80;
    server_name _;

    # Compression (PERF-4): ~68% transfer cut on JS/CSS/JSON.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;


    # Security headers (SEC-L2/INF-4). The widget is intentionally embeddable in
    # storefront iframes, so X-Frame-Options is never set (it cannot express an
    # allowlist) and frame-ancestors is opt-in via WIDGET_FRAME_ANCESTORS above.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Applies to the HTML document the iframe loads (location /widget/ inherits it);
    # the locations below that set their own add_header do not, which is fine for JS/CSS.
    add_header Content-Security-Policy $widget_csp_frame_ancestors always;

    location = /widget { return 301 /widget/; }

    location /widget/ {
        alias /usr/share/nginx/html/;
        try_files $uri /widget/index.html;
    }

    # Versioned loader path (PLN-260819 S3). Customer pages install
    # /v1/embed.js, so the loader contract survives us rebuilding the widget.
    # Short cache: a loader fix must reach installed pages the same day, and the
    # file is ~20KB.
    location = /widget/v1/embed.js {
        alias /usr/share/nginx/html/embed.js;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Base font stylesheet (PLN-261012 SG-82): index.html links /widget/base-font.css
    # instead of a hard-coded CDN URL, so where the font comes from is a deployment
    # setting (WIDGET_FONT_CSS_URL) rather than a rebuild. The exact match wins over
    # the static default file shipped in the image.
    location = /widget/base-font.css {
        default_type text/css;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 $widget_font_css;
    }

    # Per-deployment runtime config; never cached, or a redeployed stack would
    # keep pointing at the previous API base (PLN-260819 S3).
    location = /widget/widget-config.js {
        alias /usr/share/nginx/html/widget-config.js;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /widget/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
