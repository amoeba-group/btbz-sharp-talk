# SharpTalk — self-hosted stack (PLN-260820).
#
# One customer, one deployment, inside their own cloud: conversations and files
# never leave the account that runs this file.
#
#   bash scripts/deploy-self-hosted.sh
#
# Compose project name keeps volumes apart from any other stack on the host:
#   COMPOSE_PROJECT_NAME=sharptalk (set by the deploy script)
#
# TLS is NOT terminated here. Put your own load balancer / nginx / Caddy in
# front of :8080 — a customer's cloud already has one, and certificates belong
# where their other certificates live.
name: sharptalk

# Image delivery (PLN-261012 SG-80). Every app image carries an explicit name:
#
#   ${SHARPTALK_IMAGE_PREFIX:-sharptalk}/api:${SHARPTALK_VERSION:-local}
#
# next to its `build:` section, so one file serves both ways of getting software
# onto a host:
#   * build on the host   up -d --build         builds AND tags the image with that name
#   * release bundle      up -d --no-build      runs images loaded from the bundle
#                         (scripts/build-release-bundle.sh + deploy-self-hosted.sh --bundle)
# SHARPTALK_VERSION is what makes a rollback possible at all: the previous release's
# images stay on the host under their own tag instead of being overwritten by `local`.
# The deploy script sets it for you; set it by hand only when running compose yourself.

# Docker keeps container logs forever by default. A busy API fills the disk and takes
# the whole stack down with it (INCIDENT-RESPONSE.md "log rotation: undecided").
# 5 x 20 MB per container unless you size it otherwise.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: ${LOG_MAX_FILE:-5}

services:
  api:
    build:
      context: ../..
      dockerfile: docker/self-hosted/Dockerfile.api
      args:
        NODE_IMAGE: ${SHARPTALK_NODE_IMAGE:-node:20.19.0-alpine3.21}
    image: ${SHARPTALK_IMAGE_PREFIX:-sharptalk}/api:${SHARPTALK_VERSION:-local}
    container_name: sharptalk_api
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    env_file:
      # Resolved relative to THIS file unless SHARPTALK_ENV_FILE (an absolute path) is set -
      # how a release bundle keeps its configuration outside the bundle directory, so it
      # survives an upgrade. deploy-self-hosted.sh exports it for you.
      - ${SHARPTALK_ENV_FILE:-./.env.self-hosted}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    expose:
      - '3000'
    volumes:
      # Chat attachments and the widget logo. The image is rebuilt on every
      # upgrade, so anything written outside this volume is gone by the next
      # one — silently, because nothing errors when it happens.
      - sharptalk_uploads:/data/uploads
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ../..
      dockerfile: docker/self-hosted/Dockerfile.web
      args:
        NODE_IMAGE: ${SHARPTALK_NODE_IMAGE:-node:20.19.0-alpine3.21}
        NGINX_IMAGE: ${SHARPTALK_NGINX_IMAGE:-nginx:1.27.5-alpine}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        # Empty = derive from VITE_API_BASE_URL / the console's own origin, never
        # Amoeba's host (apps/web/src/lib/widget-url-resolve.ts).
        VITE_WIDGET_URL: ${VITE_WIDGET_URL:-}
        # Host cited by the bundled manuals; the deploy script derives it from APP_PUBLIC_URL.
        MANUAL_HOST: ${MANUAL_HOST:-talk.example.com}
        # Extra origins allowed to frame the console (default none: 'self' only).
        CONSOLE_FRAME_ANCESTORS: ${CONSOLE_FRAME_ANCESTORS:-}
    image: ${SHARPTALK_IMAGE_PREFIX:-sharptalk}/web:${SHARPTALK_VERSION:-local}
    container_name: sharptalk_web
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    expose:
      - '80'

  # The storefront widget. Missing from the old production stack, which is why
  # a customer domain like talk.example.com had nothing to serve.
  widget:
    build:
      context: ../..
      dockerfile: docker/self-hosted/Dockerfile.widget
      args:
        NODE_IMAGE: ${SHARPTALK_NODE_IMAGE:-node:20.19.0-alpine3.21}
        NGINX_IMAGE: ${SHARPTALK_NGINX_IMAGE:-nginx:1.27.5-alpine}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_BASE: /widget/
    image: ${SHARPTALK_IMAGE_PREFIX:-sharptalk}/widget:${SHARPTALK_VERSION:-local}
    container_name: sharptalk_widget
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      # Who may frame the widget, and where its base font comes from (PLN-261012
      # SG-82). Unset FRAME_ANCESTORS = no header (any site may embed); an EMPTY
      # FONT_CSS_URL = system fonts only, UNSET = the image default (jsDelivr).
      WIDGET_FRAME_ANCESTORS: ${WIDGET_FRAME_ANCESTORS:-}
      WIDGET_FONT_CSS_URL: ${WIDGET_FONT_CSS_URL-https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css}
    expose:
      - '80'

  mysql:
    # Pinned to the patch release the stack was tested on (was `mysql:8.0`, which
    # moves). Override with MYSQL_IMAGE to use a private mirror.
    image: ${MYSQL_IMAGE:-mysql:8.0.44}
    container_name: sharptalk_mysql
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # Loopback only. Reach it through an SSH tunnel or your cloud's bastion,
      # never over the internet.
      - '127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306'
    volumes:
      - sharptalk_mysql_data:/var/lib/mysql
      # Schema comes from docker/init-sql/01-schema.sql on first boot, then from
      # sql/migration_*.sql applied MANUALLY before each upgrade (deploy
      # standard 04 §3). DB_SYNCHRONIZE stays false.
      - ../init-sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.9-alpine}
    container_name: sharptalk_redis
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    volumes:
      - sharptalk_redis_data:/data

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13.7-management-alpine}
    container_name: sharptalk_rabbitmq
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - sharptalk_rabbitmq_data:/var/lib/rabbitmq

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.15.1}
    container_name: sharptalk_qdrant
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    expose:
      - '6333'
    volumes:
      - sharptalk_qdrant_data:/qdrant/storage

  nginx:
    image: ${SHARPTALK_NGINX_IMAGE:-nginx:1.27.5-alpine}
    container_name: sharptalk_nginx
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Per-deployment widget runtime config (PLN-260819 S3): one widget build
      # serves every deployment, and this file tells it which API to call.
      - ./widget-config.js:/usr/share/nginx/widget-config.js:ro
      # Static live widget design files (PLN-260910 P4 D-14), read-only.
      - sharptalk_uploads:/data/uploads:ro
    depends_on:
      - api
      - web
      - widget
    ports:
      - '${HTTP_PORT:-8080}:80'

volumes:
  # Named after the project so `docker volume ls` says what they belong to.
  sharptalk_uploads:
  sharptalk_mysql_data:
  sharptalk_redis_data:
  sharptalk_rabbitmq_data:
  sharptalk_qdrant_data:
