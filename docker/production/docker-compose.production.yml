# btbz-SharpTalk — production stack. Amoeba Structure v2 §5.1.
# Run: docker compose -f docker/production/docker-compose.production.yml \
#        --env-file docker/production/.env.production up -d --build
# Build context is the repo root (../..) so turbo sees the whole workspace.
# Production-tuned: restart: always, no DB/queue ports exposed to host.
services:
  api:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.api
    container_name: sharptalk_api_production
    restart: always
    env_file:
      - ./.env.production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    expose:
      - '3000'
    volumes:
      # Chat attachments, the widget logo and tenant assets (FIX-260911). The
      # image is rebuilt on every deploy, so anything written outside this
      # volume is gone by the next one — silently. UPLOAD_DIR in .env.production
      # must be /data/uploads; deploy-production.sh refuses otherwise.
      - sharptalk_uploads_production:/data/uploads
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: sharptalk_web_production
    restart: always
    expose:
      - '80'

  # Customer widget (Vite SPA built with base /widget/). Added 2026-09-13
  # (PLN-260913): production previously shipped without it, so a storefront
  # embed against a production host had nothing to load.
  widget:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.widget
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_BASE: /widget/
    container_name: sharptalk_widget_production
    restart: always
    environment:
      # Who may frame the widget, and where its base font comes from (PLN-261012
      # SG-82). Unset FRAME_ANCESTORS = no header (any site may embed); an EMPTY
      # FONT_CSS_URL = system fonts only, UNSET = the image default (jsDelivr).
      WIDGET_FRAME_ANCESTORS: ${WIDGET_FRAME_ANCESTORS:-}
      WIDGET_FONT_CSS_URL: ${WIDGET_FONT_CSS_URL-https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css}
    expose:
      - '80'

  mysql:
    image: mysql:8.0
    container_name: sharptalk_mysql_production
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # No host port published in production — DB is internal-network only.
    volumes:
      - sharptalk_mysql_production_data:/var/lib/mysql
      # Schema is applied via migrations (DB_SYNCHRONIZE=false).
      - ../init-sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sharptalk_redis_production
    restart: always
    volumes:
      - sharptalk_redis_production_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sharptalk_rabbitmq_production
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - sharptalk_rabbitmq_production_data:/var/lib/rabbitmq

  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: sharptalk_qdrant_production
    restart: always
    # Internal-network only — the API reaches it via QDRANT_URL=http://qdrant:6333.
    volumes:
      - sharptalk_qdrant_production_data:/qdrant/storage

  nginx:
    image: nginx:alpine
    container_name: sharptalk_nginx_production
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Static live widget design files (PLN-260910 P4 D-14), read-only.
      - sharptalk_uploads_production:/data/uploads:ro
    depends_on:
      - api
      - web
      - widget
    ports:
      - '80:80'

volumes:
  sharptalk_mysql_production_data:
  sharptalk_redis_production_data:
  sharptalk_rabbitmq_production_data:
  sharptalk_qdrant_production_data:
  sharptalk_uploads_production:
