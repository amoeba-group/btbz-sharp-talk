name: CI

# Build-green gate for pull requests and pushes to the integration branches.
# Runs the same checks the deploy checklist requires (typecheck + tests + build)
# so regressions are caught before merge instead of at deploy time.

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A variable the code reads but the self-hosted template never mentions is
      # not a failure an operator can see: it falls back to a default and works
      # until the default is wrong. UPLOAD_DIR is the example that costs files.
      - name: Env template completeness
        run: npm run env:check

      # The deploy-time migration check reads sql/artefacts.tsv, so a stale
      # manifest tells a customer a pending migration is already applied.
      - name: Migration manifest is current
        run: node scripts/check-migrations.mjs --check

      # A component with a fixed radius ignores the tenant's 모서리 setting and
      # says nothing about it — how 47 call sites drifted before FIX-260917.
      - name: Widget radius tokens
        run: npm run radius:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
